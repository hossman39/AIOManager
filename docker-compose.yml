services:
  aiomanager:
    image: ${AIOMANAGER_IMAGE:?Set AIOMANAGER_IMAGE to the tested ghcr.io/hossman39/aiomanager sha tag or digest}
    container_name: aiomanager
    restart: unless-stopped
    stop_grace_period: 60s
    ports:
      - '${BIND_ADDRESS:-127.0.0.1}:${HOST_PORT:-1610}:1610'
    env_file:
      - .env
    environment:
      PORT: '1610'
      DATA_DIR: /app/data
      DB_TYPE: ${DB_TYPE:?Set DB_TYPE to the database engine in use}
    volumes:
      - ./aio-data:/app/data
    healthcheck:
      test: ['CMD', 'node', 'server/healthcheck.js']
      interval: 1m
      timeout: 10s
      retries: 5
      start_period: 15s
