# Add this file only when using the bundled PostgreSQL service:
# docker compose -f docker-compose.yml -f compose.postgres.yml up -d
# Existing databases must retain their actual password and ./aio-db-data mount.
services:
  aiomanager:
    environment:
      DB_TYPE: postgres
      DATABASE_URL: postgres://aio_user:${POSTGRES_PASSWORD:?Set the existing database password, or a new hex password for a fresh database}@aiomanager-db:5432/aio_manager
      DB_SSL_MODE: disable
    depends_on:
      aiomanager-db:
        condition: service_healthy

  aiomanager-db:
    image: postgres:16-alpine
    container_name: aiomanager_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: aio_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: aio_manager
    volumes:
      - ./aio-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aio_user -d aio_manager']
      interval: 10s
      timeout: 5s
      retries: 5
